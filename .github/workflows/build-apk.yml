name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Fetch the latest MagiskSSH module zip from upstream (GitLab releases repo)
      - name: Download MagiskSSH module
        run: |
          mkdir -p app/src/main/assets
          curl -sL -o app/src/main/assets/magisk_ssh.zip \
            "https://gitlab.com/d4rcm4rc/MagiskSSH_releases/-/raw/main/magisk_ssh_v0.27.zip"
          ls -la app/src/main/assets/magisk_ssh.zip
          # sanity check: must be a real zip (PK magic bytes)
          python3 -c "data=open('app/src/main/assets/magisk_ssh.zip','rb').read(2); assert data==b'PK', 'not a zip'; print('OK: valid zip')"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: magisk-ssh-manager-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: magisk-ssh-manager-release
          path: app/build/outputs/apk/release/*.apk
